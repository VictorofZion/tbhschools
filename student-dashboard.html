<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Portal - Tetotim Blessed Hope School</title>
  <link rel="stylesheet" href="global.css" />
  <script src="https://remitademo.net/payment/v1/remita-pay-inline.bundle.js"></script>
  <style>
    :root {
      --primary-navy: #0a1931;
      --accent-coral: #e25b38;
      --bg-cream: #f9f6f0;
      --border-color: #e4dfd5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Geist-Regular', sans-serif;
      background-color: var(--bg-cream);
      color: #1c1c1c;
      display: flex;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 260px;
      background-color: var(--primary-navy);
      color: #ffffff;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
    .brand img { width: 36px; height: auto; }
    .brand h2 { font-family: 'Geist-Bold', sans-serif; font-size: 16px; margin: 0; }
    
    .nav-links { display: flex; flex-direction: column; gap: 8px; }
    .nav-btn {
      background: transparent;
      border: none;
      color: #e4dfd5;
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      background-color: var(--accent-coral);
      color: #ffffff;
    }

    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .header-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .student-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-coral);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .status-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 12px;
    }
    .badge-paid { background: #d4edda; color: #155724; }
    .badge-unpaid { background: #f8d7da; color: #721c24; }
    
    .pay-btn {
      background-color: var(--accent-coral);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    
    table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background-color: #0a1931; color: #ffffff; }
    
    .btn-action {
      background-color: var(--accent-coral);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      display: inline-block;
    }

    .logout-btn {
      background-color: rgba(255,255,255,0.1);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

/* Progress Loader Modal */
.progress-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 25, 49, 0.85);
  z-index: 2000;
  justify-content: center;
  align-items: center;
}
.progress-modal-card {
  background: #ffffff;
  padding: 32px;
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}
.progress-track {
  width: 100%;
  height: 12px;
  background: #e4dfd5;
  border-radius: 6px;
  overflow: hidden;
  margin: 16px 0 8px 0;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: var(--accent-coral, #e25b38);
  transition: width 0.2s ease;
}
.progress-percent-text {
  font-family: 'Geist-Bold', sans-serif;
  font-size: 14px;
  color: var(--primary-navy, #0a1931);
}

  </style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand">
        <img src="items/logo.png" alt="Logo" />
        <h2>TBHS Portal</h2>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" onclick="switchTab('overviewTab', event)">Overview &amp; Results</button>
        <button class="nav-btn" onclick="switchTab('examsTab', event)">Online CBT Exams</button>
        <button class="nav-btn" onclick="switchTab('assignmentsTab', event)">Class Assignments</button>
      </nav>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </aside>

  <main class="main-content">
    <div class="header-bar">
      <img id="studentAvatar" src="https://via.placeholder.com/150" class="student-avatar" alt="Avatar" />
      <div>
        <h1 id="welcomeHeading" style="font-family: 'Instrument Serif-Regular', serif; font-size: 36px; color: var(--primary-navy); margin: 0;">Student Portal</h1>
        <p id="serialNumberBadge" style="margin: 4px 0 0 0; color: var(--accent-coral); font-weight: 700; font-size: 14px;"></p>
      </div>
    </div>

    <!-- TAB 1: Overview & Results -->
    <section id="overviewTab" class="tab-content active">
      <div class="status-card">
        <div>
          <h3 style="margin: 0 0 4px 0;">School Fee Status</h3>
          <p id="studentInfo" style="margin: 0; color: #6e7787; font-size: 14px;"></p>
        </div>
        <div id="paymentAction"></div>
      </div>

      <h2 style="font-family: 'Instrument Serif-Regular', serif; font-size: 28px; color: var(--primary-navy);">Academic Results</h2>
      <table>
        <thead>
          <tr>
            <th>Subject</th>
            <th>Test (40)</th>
            <th>Exam (60)</th>
            <th>Total Score</th>
            <th>Term</th>
            <th>Session</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody"></tbody>
      </table>
    </section>

    <!-- TAB 2: Online CBT Exams -->
    <section id="examsTab" class="tab-content">
      <h2 style="font-family: 'Instrument Serif-Regular', serif; font-size: 28px; color: var(--primary-navy); margin-top: 0;">Available CBT Examinations</h2>
      <table>
        <thead>
          <tr>
            <th>Exam Title</th>
            <th>Subject</th>
            <th>Class</th>
            <th>Duration</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="examsTableBody"></tbody>
      </table>
    </section>

    <!-- TAB 3: Class Assignments -->
    <!-- Updated Tab 3 inside student-dashboard.html -->
<section id="assignmentsTab" class="tab-content">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="font-family: 'Instrument Serif-Regular', serif; font-size: 28px; color: var(--primary-navy); margin: 0;">Class Learning Resources</h2>
    <select id="materialTypeFilter" onchange="loadAssignments()" style="padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-color);">
      <option value="">All Materials</option>
      <option value="note">Class Notes</option>
      <option value="assignment">Assignments</option>
    </select>
  </div>
  <div id="assignmentsWrapper">
    <!-- Dynamically loaded learning materials -->
  </div>
</section>


  </main>

  <!-- Universal Progress Loader Modal -->
<div class="progress-modal-overlay" id="progressModal">
  <div class="progress-modal-card">
    <h3 id="progressTitle" style="font-family: 'Instrument Serif-Regular', serif; font-size: 24px; color: #0a1931; margin: 0;">Processing...</h3>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="progress-percent-text" id="progressPercent">0%</div>
  </div>
</div>

  <script>
   const API_BASE = "/api";
    const token = localStorage.getItem("tbhs_token");
    const user = JSON.parse(localStorage.getItem("tbhs_user") || "{}");

    if (!token || user.role !== "student") {
      window.location.href = "login.html";
    }

    document.getElementById("welcomeHeading").innerText = `Welcome, ${user.full_name}`;
    if (user.avatar_url) document.getElementById("studentAvatar").src = user.avatar_url;

    const studentProfile = user.studentProfile || {};
    if (studentProfile.serial_number) {
      document.getElementById("serialNumberBadge").innerText = `Serial No: ${studentProfile.serial_number}`;
    }
    document.getElementById("studentInfo").innerText = `Reg No: ${studentProfile.reg_number || 'N/A'} | Class: ${studentProfile.class_level || 'N/A'}`;

    const paymentContainer = document.getElementById("paymentAction");
    if (studentProfile.fee_status === "PAID") {
      paymentContainer.innerHTML = `<span class="badge badge-paid">FEE PAID</span>`;
    } else {
      paymentContainer.innerHTML = `
        <span class="badge badge-unpaid" style="margin-right: 12px;">${studentProfile.fee_status || 'UNPAID'}</span>
        <button class="pay-btn" onclick="paySchoolFees()">Pay Tuition via Remita</button>
      `;
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      if (evt && evt.target) evt.target.classList.add("active");

      if (tabId === 'examsTab') loadExams();
      if (tabId === 'assignmentsTab') loadAssignments();
    }

    async function loadResults() {
      if (!studentProfile.id) return;
      try {
        const res = await fetch(`${API_BASE}/academic/results/${studentProfile.id}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        const tbody = document.getElementById("resultsTableBody");
        tbody.innerHTML = "";

        if (data.results && data.results.length > 0) {
          data.results.forEach(r => {
            const total = parseFloat(r.test_score) + parseFloat(r.exam_score);
            tbody.innerHTML += `
              <tr>
                <td><strong>${r.subject}</strong></td>
                <td>${r.test_score}</td>
                <td>${r.exam_score}</td>
                <td><strong>${total}</strong></td>
                <td>${r.term}</td>
                <td>${r.session}</td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #6e7787;">No academic results recorded yet.</td></tr>`;
        }
      } catch (err) {
        console.error("Failed to load results", err);
      }
    }

   async function loadExams() {
  if (!studentProfile.class_level) return;
  try {
    const res = await fetch(`${API_BASE}/exams/class/${studentProfile.class_level}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    const tbody = document.getElementById("examsTableBody");
    tbody.innerHTML = "";

    if (data.exams && data.exams.length > 0) {
      data.exams.forEach(e => {
        const typeBadge = e.type === 'test' 
          ? `<span style="background: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">TEST (40M)</span>`
          : `<span style="background: #fbe9e7; color: #d84315; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">EXAM (60M)</span>`;

        const actionBtn = e.is_completed
          ? `<span style="background: #e8f5e9; color: #2e7d32; padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 13px;">COMPLETED</span>`
          : `<a href="exam.html?examId=${e.id}&duration=${e.duration_minutes}" class="btn-action">Start Assessment</a>`;

        tbody.innerHTML += `
          <tr>
            <td><strong>${e.title}</strong> ${typeBadge}</td>
            <td>${e.subject}</td>
            <td>${e.class_level}</td>
            <td>${e.duration_minutes} Mins</td>
            <td>${actionBtn}</td>
          </tr>
        `;
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #6e7787;">No CBT tests or exams scheduled for your class.</td></tr>`;
    }
  } catch (err) {
    console.error("Failed to load assessments", err);
  }
}
   async function loadAssignments() {
  if (!studentProfile.class_level) return;
  const filterType = document.getElementById("materialTypeFilter") ? document.getElementById("materialTypeFilter").value : "";
  const url = `${API_BASE}/materials/class/${studentProfile.class_level}${filterType ? '?type=' + filterType : ''}`;

  try {
    const res = await fetch(url, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    const data = await res.json();
    const wrapper = document.getElementById("assignmentsWrapper");
    wrapper.innerHTML = "";

    if (data.materials && data.materials.length > 0) {
      data.materials.forEach(m => {
        const isNote = m.material_type === 'note';
        const typeBadge = isNote
          ? `<span style="background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">CLASS NOTE</span>`
          : `<span style="background: #fff3e0; color: #e65100; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px;">ASSIGNMENT</span>`;

        const dueDateText = m.due_date ? `<strong>DUE:</strong> ${new Date(m.due_date).toLocaleDateString()}` : `<strong>UPLOADED:</strong> ${new Date(m.created_at).toLocaleDateString()}`;

        wrapper.innerHTML += `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
              <h3 style="margin: 0; color: var(--primary-navy);">${m.title} ${typeBadge}</h3>
              <span style="font-size: 12px; color: var(--accent-coral);">${dueDateText}</span>
            </div>
            <p style="margin: 0 0 12px 0; font-size: 13px; color: #6e7787;"><strong>Subject:</strong> ${m.subject} | <strong>Class:</strong> ${m.class_level}</p>
            <p style="margin: 0 0 16px 0; font-size: 14px; line-height: 1.5;">${m.description || 'No additional notes provided.'}</p>
            <a href="${m.file_data}" download="${m.file_name}" class="btn-action">Download ${m.file_name}</a>
          </div>
        `;
      });
    } else {
      wrapper.innerHTML = `<p style="text-align: center; color: #6e7787;">No learning materials or assignments found for your class level.</p>`;
    }
  } catch (err) {
    console.error("Failed to load materials", err);
  }
}
    async function paySchoolFees() {
      try {
        const res = await fetch(`${API_BASE}/payments/initiate`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            student_id: studentProfile.id,
            amount: 150000,
            payer_name: user.full_name,
            payer_email: user.email,
            payer_phone: "08000000000"
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const config = data.paymentConfig;

        var paymentEngine = RmPaymentEngine.initiatePayment({
          key: config.merchantId,
          transactionId: config.orderId,
          customerId: user.email,
          firstName: user.full_name,
          lastName: "Student",
          email: user.email,
          amount: config.amount,
          narration: "TBHS School Fee Payment",
          onSuccess: async function (response) {
            await fetch(`${API_BASE}/payments/verify`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
              },
              body: JSON.stringify({
                rrr: response.RRR,
                orderId: config.orderId,
                studentId: studentProfile.id
              })
            });
            alert("Payment Verified! Reloading...");
            location.reload();
          },
          onError: function () {
            alert("Payment Cancelled.");
          }
        });
        paymentEngine.showPaymentWidget();

      } catch (err) {
        alert(err.message);
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    loadResults();


    // Progress Helper Functions
function showProgress(title) {
  document.getElementById("progressTitle").innerText = title;
  document.getElementById("progressBar").style.width = "0%";
  document.getElementById("progressPercent").innerText = "0%";
  document.getElementById("progressModal").style.display = "flex";
}

function updateProgress(percent) {
  const bounded = Math.min(100, Math.max(0, percent));
  document.getElementById("progressBar").style.width = `${bounded}%`;
  document.getElementById("progressPercent").innerText = `${bounded}%`;
}

function hideProgress() {
  document.getElementById("progressModal").style.display = "none";
}

// Download Stream Processor with Progress Bar
async function downloadFileWithProgress(fileDataUrl, fileName) {
  try {
    showProgress(`Downloading ${fileName}...`);

    const response = await fetch(fileDataUrl);
    const contentLength = response.headers.get('content-length');
    const totalBytes = contentLength ? parseInt(contentLength, 10) : 0;

    const reader = response.body.getReader();
    let loadedBytes = 0;
    const chunks = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      chunks.push(value);
      loadedBytes += value.length;

      if (totalBytes > 0) {
        const percent = Math.round((loadedBytes / totalBytes) * 100);
        updateProgress(percent);
      } else {
        // Fallback smooth increments for data-URI streams
        const simulated = Math.min(95, Math.round(loadedBytes / 1024));
        updateProgress(simulated);
      }
    }

    updateProgress(100);

    // Save File locally
    const blob = new Blob(chunks);
    const blobUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = blobUrl;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(blobUrl);

    setTimeout(hideProgress, 400);
  } catch (err) {
    hideProgress();
    alert("Download failed: " + err.message);
  }
}
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Login - Tetotim Blessed Hope School</title>
  <link rel="stylesheet" href="global.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Geist-Regular', sans-serif;
      background-color: #f9f6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #e4dfd5;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-header img {
      width: 48px;
      height: auto;
      margin-bottom: 12px;
    }
    .brand-header h2 {
      font-family: 'Instrument Serif-Regular', serif;
      color: #0a1931;
      font-size: 28px;
      margin: 0 0 4px 0;
    }
    .brand-header p {
      color: #6e7787;
      font-size: 14px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-family: 'Geist-SemiBold', sans-serif;
      font-size: 13px;
      color: #0a1931;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e4dfd5;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus {
      border-color: #e25b38;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: #e25b38;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: 'Geist-Bold', sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .login-btn:hover {
      background-color: #c84927;
    }
    .alert-box {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
    }
    .alert-error {
      background-color: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #f8b4b4;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0a1931;
      font-size: 13px;
      text-decoration: none;
    }
    .back-home:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <img src="items/logo.png" alt="TBHS Logo" />
    <h2>TBHS E-Portal Access</h2>
    <p>Sign in as Admin, Teacher, or Student</p>
  </div>

  <div id="alertBox" class="alert-box alert-error"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Account Email</label>
      <input type="email" id="email" placeholder="name@tbhs.edu.ng" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
    </div>

    <button type="submit" class="login-btn" id="submitBtn">Sign In</button>
  </form>

  <a href="index.html" class="back-home">← Return to Homepage</a>
</div>

<script>
  const API_BASE = "/api";
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    alertBox.style.display = "none";
    submitBtn.innerText = "Authenticating...";
    submitBtn.disabled = true;

    try {
      const response = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Authentication failed.");
      }

      localStorage.setItem("tbhs_token", data.token);
      localStorage.setItem("tbhs_user", JSON.stringify(data.user));

      if (data.user.role === "admin") {
        window.location.href = "admin-dashboard.html";
      } else if (data.user.role === "teacher") {
        window.location.href = "teacher-dashboard.html";
      } else if (data.user.role === "student") {
        window.location.href = "student-dashboard.html";
      }

    } catch (err) {
      alertBox.innerText = err.message;
      alertBox.style.display = "block";
      submitBtn.innerText = "Sign In";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
